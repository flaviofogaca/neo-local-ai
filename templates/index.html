<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Neo</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;

      background:
        radial-gradient(circle at top left, #1e3a8a22, transparent 30%),
        radial-gradient(circle at bottom right, #06b6d422, transparent 30%),
        #0b1120;

      color: #f9fafb;

      margin: 0;
      padding: 0;

      height: 100vh;
      overflow: hidden;
    }

    .layout {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      width: 300px;

      background: rgba(15, 23, 42, 0.75);

      backdrop-filter: blur(16px);

      border-right: 1px solid rgba(255, 255, 255, 0.08);

      height: 100vh;

      padding: 20px;

      overflow-y: auto;

      flex-shrink: 0;

      box-shadow:
        inset -1px 0 0 rgba(255, 255, 255, 0.04),
        0 0 40px rgba(37, 99, 235, 0.08);
    }

    .sidebar h2 {
      margin: 0 0 20px 0;
      font-size: 24px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .main {
      flex: 1;
      height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      background: rgba(15, 23, 42, 0.72);

      backdrop-filter: blur(18px);

      border-radius: 18px;

      padding: 16px 20px;

      margin-bottom: 16px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border: 1px solid rgba(255, 255, 255, 0.08);

      flex-shrink: 0;

      box-shadow:
        0 0 20px rgba(37, 99, 235, 0.08);
    }

    .chat-header h1 {
      margin: 0;
      font-size: 20px;
      color: white;
    }

    .chat-header span {
      color: #9ca3af;
      font-size: 14px;
    }

    .status-pill {
      background: #064e3b;
      color: #86efac;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    #chat {
      flex: 1;

      background: rgba(15, 23, 42, 0.72);

      backdrop-filter: blur(18px);

      border-radius: 18px;

      padding: 24px;

      margin-bottom: 16px;

      overflow-y: auto;

      scroll-behavior: smooth;

      min-height: 0;

      border: 1px solid rgba(255, 255, 255, 0.06);

      box-shadow:
        0 0 30px rgba(37, 99, 235, 0.05);
    }

    .message-row {
      display: flex;
      margin-bottom: 16px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.neo {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 75%;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message-row.user .message-bubble {
      background:
        linear-gradient(135deg,
          #2563eb,
          #1d4ed8);

      color: white;

      border-bottom-right-radius: 4px;

      box-shadow:
        0 0 16px rgba(37, 99, 235, 0.28);
    }

    .message-row.neo .message-bubble {
      background:
        rgba(55, 65, 81, 0.85);

      backdrop-filter: blur(12px);

      color: white;

      border-bottom-left-radius: 4px;

      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .message-bubble p {
      margin-top: 0;
      margin-bottom: 0.6rem;
    }

    .message-bubble p:last-child {
      margin-bottom: 0;
    }

    .input-container {
      position: relative;
      flex-shrink: 0;
      background: rgba(15, 23, 42, 0.72);

      backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.06);

      border-radius: 18px;

      padding: 10px;

      box-shadow:
        0 0 20px rgba(37, 99, 235, 0.05);
    }

    textarea {
      width: 100%;
      min-height: 90px;
      max-height: 220px;
      border-radius: 12px;
      padding: 14px 110px 14px 14px;
      font-size: 16px;
      line-height: 1.5;
      resize: none;
      overflow-y: auto;
      border: 1px solid #374151;
      outline: none;
      background: rgba(255, 255, 255, 0.04);
      color: white;
      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        height 0.1s ease;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.35);
    }

    textarea::placeholder {
      color: #9ca3af;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .voice-btn {
      position: absolute;
      right: 58px;
      bottom: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #111827;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      font-size: 16px;
    }

    .voice-btn:hover {
      background: #2563eb;
      transform: scale(1.05);
    }

    .voice-btn.recording {
      background: #dc2626;
      animation: pulse 1s infinite;
    }

    .send-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #000000;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .send-btn:hover {
      background: #1d4ed8;
      transform: scale(1.05);
    }

    .send-btn.disabled,
    .send-btn:disabled {
      opacity: 0.85;
      cursor: not-allowed;
    }

    .send-icon {
      font-size: 18px;
      transform: rotate(-35deg);
      margin-left: 2px;
    }

    .generating-icon {
      display: none;
      align-items: center;
      gap: 3px;
    }

    .generating-icon span {
      width: 3px;
      height: 14px;
      background: white;
      border-radius: 999px;
      animation: soundWave 0.8s infinite ease-in-out;
    }

    .generating-icon span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .generating-icon span:nth-child(3) {
      animation-delay: 0.3s;
    }

    .send-btn.generating {
      background: #2563eb;
      box-shadow:
        0 0 12px rgba(37, 99, 235, 0.7),
        0 0 24px rgba(37, 99, 235, 0.4);
      animation: pulseGlow 1.4s infinite;
    }

    .send-btn.generating .send-icon {
      display: none;
    }

    .send-btn.generating .generating-icon {
      display: flex;
    }

    .conversation-item {
      background: #111827;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .conversation-item:hover {
      background: #374151;
    }

    .conversation-item.active {
      background: #2563eb;
    }

    .conversation-item.active:hover {
      background: #1d4ed8;
    }

    .conversation-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .conversation-name {
      flex: 1;
      word-break: break-word;
      font-size: 13px;
    }

    .rename-btn,
    .delete-btn {
      background: transparent;
      font-size: 14px;
      padding: 2px;
    }

    .rename-btn {
      color: white;
    }

    .delete-btn {
      color: #fecaca;
    }

    pre {
      background: #111827;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }

    code {
      background: #111827;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: #d1d5db;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes soundWave {

      0%,
      100% {
        height: 8px;
      }

      50% {
        height: 18px;
      }
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.08);
        opacity: 0.8;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: 0.25;
        transform: scale(0.8);
      }

      40% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <div class="sidebar">
      <h2>Neo</h2>

      <button class="new-chat-btn" onclick="newChat()">
        + Nova conversa
      </button>

      <div id="conversation-list"></div>
    </div>

    <div class="main">
      <div class="chat-header">
        <div>
          <h1>Neo Local AI</h1>
          <span>gemma3:12b • Local • Ollama</span>
        </div>

        <div class="status-pill">
          Online
        </div>
      </div>

      <div id="chat"></div>

      <div class="input-container">
        <textarea id="message" placeholder="Manda a boa..."></textarea>

        <button class="voice-btn" onclick="startRecognition()" title="Falar">
          🎤
        </button>

        <button class="send-btn" onclick="sendMessage()" title="Enviar">
          <span class="send-icon">➤</span>

          <span class="generating-icon">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let history = [];
    let activeConversation = null;
    let isGenerating = false;
    let isRecording = false;
    let recognition = null;

    function formatConversationName(fileName) {
      return fileName.replace(".json", "");
    }

    function renderMessage(role, content) {
      const chat = document.getElementById("chat");
      const className = role === "user" ? "user" : "neo";

      chat.innerHTML += `
        <div class="message-row ${className}">
          <div class="message-bubble">
            ${marked.parse(content)}
          </div>
        </div>
      `;
    }

    function scrollToBottom() {
      const chat = document.getElementById("chat");

      chat.scrollTo({
        top: chat.scrollHeight,
        behavior: "smooth"
      });
    }

    function addThinking() {
      const chat = document.getElementById("chat");
      const thinkingId = "thinking-" + Date.now();

      chat.innerHTML += `
        <div class="message-row neo" id="${thinkingId}">
          <div class="message-bubble">
            <div class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      `;

      scrollToBottom();

      return thinkingId;
    }

    function replaceThinking(id, response) {
      const element = document.getElementById(id);

      if (element) {
        element.innerHTML = `
          <div class="message-bubble">
            ${marked.parse(response)}
          </div>
        `;
      }
    }

    async function newChat() {
      history = [];
      activeConversation = null;
      document.getElementById("chat").innerHTML = "";

      await fetch("/new-chat", {
        method: "POST"
      });

      await loadConversations();
    }

    async function loadConversations() {
      const response = await fetch("/conversations");
      const data = await response.json();

      const list = document.getElementById("conversation-list");
      list.innerHTML = "";

      data.conversations.forEach(file => {
        const encodedFile = encodeURIComponent(file);
        const activeClass = activeConversation === file ? "active" : "";

        list.innerHTML += `
          <div class="conversation-item ${activeClass}">
            <div
              class="conversation-name"
              onclick="loadConversation('${encodedFile}')"
            >
              ${formatConversationName(file)}
            </div>

            <div class="conversation-actions">
              <button
                class="rename-btn"
                onclick="event.stopPropagation(); renameConversation('${file}')"
              >
                ✏️
              </button>

              <button
                class="delete-btn"
                onclick="event.stopPropagation(); deleteConversation('${file}')"
              >
                🗑️
              </button>
            </div>
          </div>
        `;
      });
    }

    async function renameConversation(oldName) {
      const newName = prompt("Novo nome da conversa:");

      if (!newName) {
        return;
      }

      await fetch("/rename-conversation", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          old_name: oldName,
          new_name: newName
        })
      });

      if (activeConversation === oldName) {
        activeConversation =
          newName.endsWith(".json")
            ? newName
            : `${newName}.json`;
      }

      await loadConversations();
    }

    async function loadConversation(filename) {
      activeConversation = decodeURIComponent(filename);

      await loadConversations();

      const response = await fetch(`/conversations/${filename}`);
      const data = await response.json();

      const chat = document.getElementById("chat");
      chat.innerHTML = "";
      history = [];

      data.messages.forEach(msg => {
        renderMessage(msg.role, msg.content);

        history.push({
          role: msg.role,
          content: msg.content
        });
      });

      scrollToBottom();
    }

    async function deleteConversation(filename) {
      const confirmed = confirm(
        `Deseja apagar:\n\n${formatConversationName(filename)}?`
      );

      if (!confirmed) return;

      await fetch(`/delete-conversation/${encodeURIComponent(filename)}`, {
        method: "DELETE"
      });

      if (activeConversation === filename) {
        activeConversation = null;
        document.getElementById("chat").innerHTML = "";
        history = [];
      }

      await loadConversations();
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const message = input.value.trim();

      if (!message || isGenerating) return;

      isGenerating = true;

      const sendButton = document.querySelector(".send-btn");
      sendButton.disabled = true;
      sendButton.classList.add("disabled");
      sendButton.classList.add("generating");

      renderMessage("user", message);

      history.push({
        role: "user",
        content: message
      });

      input.value = "";
      input.style.height = "90px";

      const thinkingId = addThinking();
      let fullResponse = "";

      try {
        const response = await fetch("/chat-stream", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message,
            history: history
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
          const { value, done } = await reader.read();

          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          fullResponse += chunk;

          replaceThinking(thinkingId, fullResponse);
          scrollToBottom();
        }

        history.push({
          role: "neo",
          content: fullResponse
        });

        history = history.slice(-10);

        await loadConversations();

      } catch (error) {
        replaceThinking(
          thinkingId,
          "Erro ao gerar resposta."
        );
      }

      isGenerating = false;

      sendButton.disabled = false;
      sendButton.classList.remove("disabled");
      sendButton.classList.remove("generating");

      scrollToBottom();
    }

    const textarea = document.getElementById("message");

    textarea.addEventListener(
      "keydown",
      function (event) {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );

    function autoResizeTextarea() {
      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
    }

    textarea.addEventListener(
      "input",
      autoResizeTextarea
    );

    function setupSpeechRecognition() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      const voiceBtn = document.querySelector(".voice-btn");

      if (!SpeechRecognition) {
        voiceBtn.disabled = true;
        voiceBtn.title = "Reconhecimento de voz não suportado neste navegador";
        voiceBtn.style.opacity = "0.4";
        return;
      }

      recognition = new SpeechRecognition();

      recognition.lang = "pt-BR";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = function (event) {
        const texto = event.results[0][0].transcript;

        textarea.value = texto;
        textarea.dispatchEvent(new Event("input"));
      };

      recognition.onend = function () {
        const voiceBtn = document.querySelector(".voice-btn");

        isRecording = false;
        voiceBtn.classList.remove("recording");
      };

      recognition.onerror = function () {
        const voiceBtn = document.querySelector(".voice-btn");

        isRecording = false;
        voiceBtn.classList.remove("recording");
      };
    }

    function startRecognition() {
      const voiceBtn = document.querySelector(".voice-btn");

      if (!recognition) {
        return;
      }

      if (isRecording) {
        recognition.stop();
        isRecording = false;
        voiceBtn.classList.remove("recording");
        return;
      }

      isRecording = true;
      voiceBtn.classList.add("recording");

      recognition.start();
    }

    setupSpeechRecognition();
    loadConversations();
  </script>

</body>

</html>
